<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEVELMAP // Command Deck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#07060f; --panel:#0d0b1c; --panel-2:#14112b; --line:#2a2455;
  --cyan:#19f3ff; --magenta:#ff2bd6; --amber:#ffb830; --violet:#8a5cff;
  --text:#d7dcff; --dim:#7b78a8;
  --glow-c:0 0 8px rgba(25,243,255,.55); --glow-m:0 0 10px rgba(255,43,214,.5);
  --display:'Orbitron',ui-monospace,Menlo,monospace; --body:'Rajdhani',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--text);font:500 15px/1.4 var(--body);overflow:hidden;
  display:grid;grid-template-rows:auto 1fr auto;height:100%;
  background-image:
    radial-gradient(900px 500px at 15% -10%,rgba(138,92,255,.18),transparent 60%),
    radial-gradient(700px 500px at 100% 110%,rgba(255,43,214,.12),transparent 60%),
    linear-gradient(rgba(25,243,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(25,243,255,.035) 1px,transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.16) 2px 3px)}

/* ── CONTROL PANEL ── */
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#15112e,#0b0919);position:relative;z-index:50}
#bar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--magenta),transparent);box-shadow:var(--glow-c)}
.brand{font:700 15px var(--display);letter-spacing:.22em;color:var(--cyan);text-shadow:var(--glow-c);white-space:nowrap}
.brand b{color:var(--magenta);text-shadow:var(--glow-m)}
.spacer{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  background:transparent;border:1px solid var(--line);padding:5px 10px;cursor:pointer;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:.15s}
.chip:hover{color:var(--text);border-color:var(--violet)}
.chip.on{color:#05040c;background:var(--cyan);border-color:var(--cyan);box-shadow:var(--glow-c)}
.chip.ghost{color:var(--amber);border-color:rgba(255,184,48,.4)}
#clock{font:500 12px var(--display);color:var(--amber);letter-spacing:.1em}

/* ── DOCK GRID ── */
#deck{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) auto;
  gap:8px;padding:8px;min-height:0}
.dock{position:relative;display:flex;gap:8px;min-width:0;min-height:0;border:1px dashed transparent;border-radius:4px}
.dock[data-dock=left],.dock[data-dock=right]{flex-direction:column}
.dock[data-dock=left]{width:var(--left-w,320px)}
.dock[data-dock=right]{width:var(--right-w,320px)}
.dock[data-dock=center]{flex-direction:column}
.dock[data-dock=bottom]{grid-column:1/-1;height:var(--bottom-h,130px)}
.dock:not(:has(>.win:not([hidden]))){display:none}
body.dragging .dock[data-dock]{display:flex;border-color:var(--line);min-width:90px;min-height:90px}
body.resizing{user-select:none}
/* edge grips: drag to resize a dock */
.grip{position:absolute;z-index:20}
.grip::after{content:"";position:absolute;background:var(--line);transition:.15s}
.grip:hover::after,.grip.active::after{background:var(--cyan);box-shadow:var(--glow-c)}
.grip[data-edge=e]{top:0;bottom:0;right:-8px;width:8px;cursor:col-resize}
.grip[data-edge=w]{top:0;bottom:0;left:-8px;width:8px;cursor:col-resize}
.grip[data-edge=n]{left:0;right:0;top:-8px;height:8px;cursor:row-resize}
.grip[data-edge=e]::after,.grip[data-edge=w]::after{inset:0 3px}
.grip[data-edge=n]::after{inset:3px 0}
.dock.over{border-color:var(--magenta)!important;background:rgba(255,43,214,.07);box-shadow:inset var(--glow-m)}
.dock[data-dock=center]>.win{flex:1}
.dock[data-dock=bottom]>.win{flex:1}
.dock[data-dock=left]>.win,.dock[data-dock=right]>.win{flex:1 1 0}
.dock:not(:has(>.win:not([hidden])))::before{content:attr(data-dock);margin:auto;font:600 11px var(--display);letter-spacing:.3em;
  text-transform:uppercase;color:var(--dim)}

/* ── WINDOW MODULE ── */
.win{display:flex;flex-direction:column;min-width:0;min-height:60px;background:var(--panel);
  border:1px solid var(--line);position:relative;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  box-shadow:0 0 0 1px #000}
.win::before{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid transparent;
  background:linear-gradient(135deg,var(--accent),transparent 35%,transparent 70%,var(--accent)) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0);opacity:.7;z-index:3}
.win[data-accent=cyan]{--accent:var(--cyan)}
.win[data-accent=magenta]{--accent:var(--magenta)}
.win[data-accent=amber]{--accent:var(--amber)}
.win[data-accent=violet]{--accent:var(--violet)}
.win-head{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 20px;cursor:grab;user-select:none;touch-action:none;
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,var(--panel-2)),var(--panel-2) 70%);
  border-bottom:1px solid var(--line)}
.win-head:active{cursor:grabbing}
.win-glyph{color:var(--accent);text-shadow:0 0 8px var(--accent);font-size:14px}
.win-title{font:700 12px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);flex:1}
.win-title small{font:600 11px var(--body);letter-spacing:.1em;color:var(--dim);margin-left:8px}
.wbtn{width:20px;height:20px;display:grid;place-items:center;background:none;border:1px solid var(--line);
  color:var(--dim);font:700 11px var(--display);cursor:pointer}
.wbtn:hover{color:var(--accent);border-color:var(--accent)}
.win-body{flex:1;min-height:0;overflow:auto;position:relative}
.win.min .win-body{display:none}
.win.min{flex:0 0 auto!important;min-height:0;height:auto!important}
.win.floating{position:fixed;z-index:200;resize:both;overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.7),0 0 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.win.floating.min{resize:none}
.win.lifted{opacity:.88}

/* module mount points: drop your implemented content in here */
.mount{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);
  font:600 11px var(--display);letter-spacing:.25em;text-transform:uppercase;text-align:center;padding:10px}
.mount span{border:1px dashed var(--line);padding:10px 14px}
#map-mount{background:
  radial-gradient(circle at 50% 50%,rgba(25,243,255,.08),transparent 55%),
  linear-gradient(rgba(25,243,255,.05) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(25,243,255,.05) 1px,transparent 1px) 0 0/40px 40px}

/* ── BAR PODS (control-panel mounts) ── */
.mount.pods{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;place-items:unset;text-align:left;
  padding:10px;overflow:auto;letter-spacing:normal;text-transform:none;font:inherit}
.pod{display:flex;align-items:center;gap:10px;padding:4px 10px;border:1px solid var(--line);background:rgba(20,17,43,.75);
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.pod-label{font:700 10px var(--display);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.pod-mount{display:flex;align-items:center;gap:8px;min-height:24px}
.pod-text{font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;min-width:64px}
.led{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
.led[data-s=ok]{background:#3dff8b;box-shadow:0 0 8px #3dff8b}
.led[data-s=busy]{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1s infinite}
.led[data-s=err]{background:var(--magenta);box-shadow:var(--glow-m)}
@keyframes pulse{50%{opacity:.35}}
.pbtn{font:600 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);background:transparent;
  border:1px solid rgba(25,243,255,.4);padding:3px 8px;cursor:pointer}
.pbtn:hover{background:var(--cyan);color:#05040c;box-shadow:var(--glow-c)}

/* ── STATUS RAIL ── */
#status{display:flex;gap:18px;padding:5px 14px;border-top:1px solid var(--line);background:#0a0817;
  font:500 11px var(--display);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
#status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:6px;box-shadow:0 0 6px var(--amber)}
#status i.ok{background:#3dff8b;box-shadow:0 0 6px #3dff8b}

@media(max-width:820px){
  #deck{grid-template-columns:1fr;grid-template-rows:none;overflow:auto}
  .dock[data-dock=left],.dock[data-dock=right]{width:auto}
  .dock[data-dock=center]{min-height:55vh}.dock[data-dock=bottom]{height:auto}
  body{overflow:auto}
  .chips,.grip{display:none}
}
</style>
</head>
<body>

<!-- CONTROL PANEL / NAV -->
<header id="bar">
  <div class="brand">LEVEL<b>MAP</b> // DECK</div>
  <nav class="chips" id="toggles"></nav>
  <div class="spacer"></div>
  <button class="chip ghost" id="reset">⟲ Reset Layout</button>
  <div id="clock">--:--:--</div>
</header>

<!-- DOCK REGIONS -->
<main id="deck">
  <section class="dock" data-dock="left"></section>
  <section class="dock" data-dock="center"></section>
  <section class="dock" data-dock="right"></section>
  <section class="dock" data-dock="bottom"></section>
</main>

<footer id="status">
  <span><i class="ok"></i>Deck online</span>
  <span><i id="feed-led"></i><span id="feed-text">Feed: standby</span></span>
  <span class="spacer"></span>
  <span>Drag title bars to re-dock</span>
</footer>

<script>
/* ═════════ Window manager (generic, content-agnostic) ═════════ */
const Deck = (() => {
  const docks = [...document.querySelectorAll('.dock')];
  const registry = new Map();
  const toggles = document.getElementById('toggles');

  function create({id, title, sub = '', glyph = '◈', accent = 'cyan', home = 'center', mountId}) {
    const el = document.createElement('article');
    el.className = 'win'; el.dataset.accent = accent; el.dataset.home = home; el.id = 'win-' + id;
    el.innerHTML = `
      <header class="win-head">
        <span class="win-glyph">${glyph}</span>
        <span class="win-title">${title}<small>${sub}</small></span>
        <button class="wbtn" data-act="min" title="Collapse">–</button>
        <button class="wbtn" data-act="float" title="Float / dock">◱</button>
        <button class="wbtn" data-act="close" title="Close">×</button>
      </header>
      <div class="win-body"><div class="mount" id="${mountId}"><span>${title} mount</span></div></div>`;
    registry.set(id, el);
    dockTo(el, home);
    el.querySelector('.win-head').addEventListener('pointerdown', e => startDrag(e, el));
    el.addEventListener('pointerdown', () => raise(el));
    el.querySelector('.win-head').addEventListener('click', e => {
      const a = e.target.dataset.act; if (!a) return;
      if (a === 'min') el.classList.toggle('min');
      if (a === 'float') el.classList.contains('floating') ? dockTo(el, el.dataset.home) : float(el);
      if (a === 'close') setVisible(id, false);
    });
    const chip = document.createElement('button');
    chip.className = 'chip on'; chip.textContent = title; chip.dataset.id = id;
    chip.onclick = () => setVisible(id, el.hidden);
    toggles.appendChild(chip);
    return el;
  }

  function setVisible(id, show) {
    const el = registry.get(id); el.hidden = !show;
    el.style.display = show ? '' : 'none';
    toggles.querySelector(`[data-id="${id}"]`).classList.toggle('on', show);
  }

  function dockTo(el, region, beforeEl = null) {
    const dock = docks.find(d => d.dataset.dock === region);
    el.classList.remove('floating'); el.style.cssText = el.style.display ? 'display:' + el.style.display : '';
    dock.insertBefore(el, beforeEl);
  }

  function float(el, rect = el.getBoundingClientRect()) {
    el.classList.add('floating');
    Object.assign(el.style, {left: rect.left + 'px', top: rect.top + 'px',
      width: Math.max(rect.width, 280) + 'px', height: Math.max(Math.min(rect.height, 420), 180) + 'px'});
    document.body.appendChild(el); raise(el);
  }

  let z = 200; const raise = el => { if (el.classList.contains('floating')) el.style.zIndex = ++z; };

  function dockAt(x, y) {
    return docks.find(d => { const r = d.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
  }

  function startDrag(e, el) {
    if (e.target.closest('.wbtn') || e.button > 0) return;
    const rect = el.getBoundingClientRect();
    const dx = e.clientX - rect.left, dy = e.clientY - rect.top;
    let moved = false, target = null;
    const head = window; e.preventDefault(); // window listeners: reparenting the window mid-drag would drop pointer capture

    const move = ev => {
      if (!moved && Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) < 5) return;
      if (!moved) { moved = true; float(el, rect); el.classList.add('lifted'); document.body.classList.add('dragging'); }
      el.style.left = ev.clientX - dx + 'px'; el.style.top = ev.clientY - dy + 'px';
      el.style.pointerEvents = 'none';
      const d = dockAt(ev.clientX, ev.clientY);
      if (d !== target) { target?.classList.remove('over'); d?.classList.add('over'); target = d; }
    };
    const up = ev => {
      head.removeEventListener('pointermove', move); head.removeEventListener('pointerup', up);
      head.removeEventListener('pointercancel', up);
      el.style.pointerEvents = ''; el.classList.remove('lifted');
      document.body.classList.remove('dragging');
      docks.forEach(d => d.classList.remove('over'));
      if (moved && target) {
        const sibs = [...target.children].filter(c => c !== el && c.classList.contains('win'));
        const vertical = getComputedStyle(target).flexDirection === 'column';
        const next = sibs.find(s => { const r = s.getBoundingClientRect();
          return vertical ? ev.clientY < r.top + r.height / 2 : ev.clientX < r.left + r.width / 2; });
        dockTo(el, target.dataset.dock, next || null);
        el.dataset.home = target.dataset.dock;
      }
    };
    head.addEventListener('pointermove', move); head.addEventListener('pointerup', up); head.addEventListener('pointercancel', up);
  }

  return {create, setVisible, dockTo, registry};
})();

/* ═════════ Modules ═════════ */
const layout = [
  {id:'map',      title:'Map',      sub:'// where', glyph:'◈', accent:'cyan',    home:'center', mountId:'map-mount'},
  {id:'node',     title:'Node',     sub:'// what',  glyph:'✦', accent:'amber',   home:'left',   mountId:'node-mount'},
  {id:'calendar', title:'Calendar', sub:'// when',  glyph:'⌛', accent:'magenta', home:'right',  mountId:'calendar-mount'},
  {id:'control',  title:'Control',  sub:'// how',   glyph:'⚙', accent:'violet',  home:'bottom', mountId:'control-mount'},
];
layout.forEach(Deck.create);

document.getElementById('reset').onclick = () => {
  layout.forEach(m => { const el = Deck.registry.get(m.id); el.classList.remove('min'); Deck.dockTo(el, m.home); el.dataset.home = m.home; Deck.setVisible(m.id, true); });
};

/* Dock edge grips: drag to resize, double-click to reset */
document.querySelectorAll('.dock').forEach(d => {
  const cfg = {left:['e','--left-w'], right:['w','--right-w'], bottom:['n','--bottom-h']}[d.dataset.dock];
  if (!cfg) return;
  const [edge, prop] = cfg, root = document.documentElement;
  const g = document.createElement('div'); g.className = 'grip'; g.dataset.edge = edge; d.prepend(g);
  g.addEventListener('dblclick', () => root.style.removeProperty(prop));
  g.addEventListener('pointerdown', e => {
    e.preventDefault(); g.classList.add('active'); document.body.classList.add('resizing');
    const move = ev => {
      const r = d.getBoundingClientRect();
      const v = edge === 'e' ? ev.clientX - r.left : edge === 'w' ? r.right - ev.clientX : r.bottom - ev.clientY;
      const max = edge === 'n' ? innerHeight * .6 : innerWidth * .5;
      root.style.setProperty(prop, Math.round(Math.min(Math.max(v, 140), max)) + 'px');
    };
    const up = () => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      g.classList.remove('active'); document.body.classList.remove('resizing');
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  });
});

/* Control-panel pods: small mounts in the top bar */
const Pods = (() => {
  const host = document.getElementById('control-mount'); // now lives inside the Control window
  host.className = 'mount pods'; host.innerHTML = '';
  const add = (id, label) => {
    const el = document.createElement('div'); el.className = 'pod'; el.id = 'pod-' + id;
    el.innerHTML = `<span class="pod-label">${label}</span><span class="pod-mount" id="${id}-mount"></span>`;
    host.appendChild(el); return el.querySelector('.pod-mount');
  };
  // lamp: LED + text. states: idle | ok | busy | err
  const lamp = m => {
    m.insertAdjacentHTML('afterbegin', '<i class="led" data-s="idle"></i><span class="pod-text"></span>');
    const led = m.querySelector('.led'), txt = m.querySelector('.pod-text');
    return {set(state, text) { led.dataset.s = state; if (text != null) txt.textContent = text; }};
  };

  // websocket status (also drives the footer feed LED)
  const wsL = lamp(add('ws', 'Socket')); wsL.set('idle', 'offline');
  const feedLed = document.getElementById('feed-led'), feedTxt = document.getElementById('feed-text');
  const ws = {set(state, text) {
    wsL.set(state, text); feedLed.className = state === 'ok' ? 'ok' : '';
    feedTxt.textContent = 'Feed: ' + (text || state);
  }};

  // crawler controller: status lamp + run/pause + sync
  const cM = add('crawler', 'Crawler'), cL = lamp(cM); cL.set('idle', 'paused');
  cM.insertAdjacentHTML('beforeend', '<button class="pbtn" data-a="toggle" title="Start / pause">▶</button><button class="pbtn" data-a="sync">⟳ Sync</button>');
  let running = false;
  const rest = () => cL.set(running ? 'ok' : 'idle', running ? 'crawling' : 'paused');
  cM.addEventListener('click', e => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === 'toggle') {
      running = !running; e.target.textContent = running ? '❚❚' : '▶'; rest();
      document.dispatchEvent(new CustomEvent('crawler:toggle', {detail: {running}}));
    }
    if (a === 'sync') {
      cL.set('busy', 'syncing'); document.dispatchEvent(new CustomEvent('crawler:sync'));
      setTimeout(rest, 1400); // demo only: call Pods.crawler.set(...) from your real sync handler instead
    }
  });
  const crawler = {set: cL.set, get running() { return running; }};

  // spare slot
  add('aux', 'Aux').innerHTML = '<span class="pod-text" style="color:var(--dim)">slot</span>';

  return {add, lamp, ws, crawler};
})();

/* Clock */
const clock = document.getElementById('clock');
setInterval(() => clock.textContent = new Date().toLocaleTimeString([], {hour12:false}), 1000);
clock.textContent = new Date().toLocaleTimeString([], {hour12:false});

/* Hook points for your implemented code:
   new LevelMap({container: document.getElementById('map-mount')}) etc.
   Mount points: #map-mount  #calendar-mount  #node-mount
   Status: Pods.ws.set('ok','linked')   Pods.crawler.set('busy','crawling')
   Events (on document): 'crawler:sync', 'crawler:toggle'   Extra pod: Pods.add(id,label) → mount element */
</script>
</body>
</html>
