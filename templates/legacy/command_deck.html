<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Adventure Engine{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', path='css/command_deck.css') }}">
{% block head %}{% endblock %}
</head>
<body>

<header id="bar">
  <div class="brand">LEVEL<b>MAP</b> // DECK</div>
  <nav class="chips" id="toggles"></nav>
  <div class="spacer"></div>
  <button class="chip ghost" id="reset">⟲ Reset Layout</button>
  <div id="clock">--:--:--</div>
</header>

<main id="deck">
  {% for dock in docks %}
  <section class="dock" data-dock="{{ dock }}"></section>
  {% endfor %}
</main>

<footer id="status">
  <span><i class="ok"></i>Deck online</span>
  <span><i id="feed-led"></i><span id="feed-text">Feed: standby</span></span>
  <span class="spacer"></span>
  <span>Drag title bars to re-dock</span>
</footer>

<script>window.LAYOUT = {{ modules | tojson }};</script>
<script src="{{ url_for('static', path='js/command_deck.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
